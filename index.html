<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f5f3ed"><title>One Thing</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#222b28;font:17px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:580px;margin:auto;padding:22px 16px 110px}h1{font-size:34px;margin:0}h2{font-size:21px;margin:0 0 12px}p{line-height:1.45}small,.muted{color:#58635e;font-size:14px}section{background:white;border:1px solid #dedfd8;border-radius:18px;padding:17px;margin:16px 0}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:13px 15px;background:#e5e9e2;color:#25352c;cursor:pointer;min-height:46px}button.primary{background:#245b45;color:white;font-weight:650}button.danger{color:#a32929}input,textarea,select{width:100%;padding:12px;border:1px solid #aeb8b0;border-radius:10px;background:white;color:#222;margin:5px 0 12px}label{font-size:15px;font-weight:600}textarea{min-height:85px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.task{padding:14px 0;border-top:1px solid #e2e4de;overflow-wrap:anywhere}.task:first-child{border-top:0}.task strong{display:block;margin:5px 0}.task p{white-space:pre-wrap;margin:6px 0}.tag{font-size:12px;font-weight:700;color:#526259;text-transform:uppercase;letter-spacing:.05em}.late{color:#a13d22}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:5px}.nav button{background:white;flex:1;max-width:150px;font-size:14px}.nav button.active{background:#dce9df;font-weight:bold}.big{width:100%;font-size:19px}details{margin:10px 0}summary{cursor:pointer;padding:8px 0} [hidden]{display:none!important} .notice{background:#fff1d9;padding:10px;border-radius:9px;font-size:14px} .check{display:flex;gap:8px;align-items:start}.check input{width:22px;margin:0}.focus{border:2px solid #245b45}.sub{margin:4px 0 18px}.spaced{margin-top:12px}button:focus-visible{outline:3px solid #8caa97} </style></head><body><main><header><h1>One Thing.</h1><p class="muted sub">Less to hold in your head.</p></header><div id="warning" class="notice" hidden></div><div id="view"></div></main><nav class="nav" aria-label="Main navigation"><button data-page="today">Today</button><button data-page="capture">+ Capture</button><button data-page="all">Tasks</button><button data-page="reports">Reports</button><button data-page="reset">Overload</button></nav><script>
'use strict';const $=s=>document.querySelector(s), key='one-thing-v1';let state={tasks:[],focus:null};try{let raw=localStorage.getItem(key);if(raw)state=JSON.parse(raw)}catch(e){warn('Storage unavailable. Export a backup before closing.')}let page='today',editing=null,focusStart=0,focusId=null,filter='open';function warn(t){$('#warning').hidden=false;$('#warning').textContent=t}function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){warn('Could not save on this device. Export a backup now.')}}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function day(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function tomorrow(){let d=new Date();d.setDate(d.getDate()+1);return day(d)}function due(t){return t.date&&t.date<=day()&&!t.done}function ordered(){return state.tasks.filter(t=>!t.done).sort((a,b)=>Number(due(b))-Number(due(a))||Number(b.urgent)-Number(a.urgent)||(a.date||'9999').localeCompare(b.date||'9999')||a.created-b.created)}function find(id){return state.tasks.find(t=>t.id===id)}function when(t){return t.date?(t.date===day()?'Today':t.date<day()?'Overdue · '+t.date:t.date)+(t.time?' · '+t.time:''):'No date'}function classify(text){const x=text.toLowerCase();if(/\b(siptu|shop steward|workshop|learner|learners|training|course|tutor|colleague|manager|branch|industrial relations|lesson plan|monthly report|work email|employer|wrc|assessment|participants|timesheet|work meeting)\b/.test(x))return 'Work';if(/\b(fonnlogic|gig|single release|spotify|radio pitch|mastering|mixing)\b/.test(x))return 'FonnLogic';if(/\b(kids|children|school|nappies|milk|shopping|dinner|wife|girls|groceries|laundry|bins)\b/.test(x))return 'Home';return 'Personal'}
function card(t){return `<div class="task"><div class="tag">${esc(t.area)} · <span class="${due(t)&&t.date<day()?'late':''}">${esc(when(t))}</span>${t.urgent?' · Important':''}</div><strong>${esc(t.title)}</strong>${t.next?`<p>First step: ${esc(t.next)}</p>`:''}${t.source?`<details><summary>Original message / details</summary><p>${esc(t.source)}</p></details>`:''}<div class="row"><button class="primary" data-act="${t.done?'undo':'done'}" data-id="${t.id}">${t.done?'Reopen':'Done'}</button><button data-act="edit" data-id="${t.id}">Edit</button>${t.done?'':`<button data-act="focus" data-id="${t.id}">Start</button>`}</div>${t.done?'':`<div class="row spaced"><button data-act="calendar" data-id="${t.id}">Set phone alert</button><button data-act="tomorrow" data-id="${t.id}">Move to tomorrow</button></div>`}</div>`}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let v=$('#view'),open=ordered();if(page==='today'){let t=find(focusId)||open[0];if(t?.done)t=open[0];let relevant=open.filter(t=>due(t));v.innerHTML=`<button class="primary big" data-act="new">+ Capture something</button><section class="focus"><div class="tag">One thing to do now</div>${t?`<h2 style="margin-top:8px">${esc(t.title)}</h2><p>${esc(t.next||'Open the task and decide the smallest physical first step.')}</p><div class="row"><button class="primary" data-act="focus" data-id="${t.id}">Start for 5 min</button><button data-act="done" data-id="${t.id}">Done</button></div>`:'<p>Nothing captured yet. Add a message or commitment.</p>'}</section><section><h2>Due today or overdue (${relevant.length})</h2>${['Work','Home','Personal','FonnLogic'].map(a=>{let group=relevant.filter(t=>t.area===a);return group.length?`<h3>${a} (${group.length})</h3>${group.slice(0,3).map(card).join('')}`:''}).join('')||'<p class="muted">Nothing due today.</p>'}${relevant.length>3?'<button data-page="all">See remaining tasks</button>':''}</section><section><h2>Before switching off</h2><p>Check tomorrow’s commitments and put an alert on anything time-critical.</p><button data-page="all">Review everything (${open.length})</button></section>`}else if(page==='capture'){let t=find(editing)||{};v.innerHTML=`<section><h2>${editing?'Edit task':'Get it out of your head'}</h2><form id="capture"><label for="source">Paste WhatsApp message, email or rough thought (optional)</label><textarea id="source" placeholder="Paste the exact message here…">${esc(t.source)}</textarea><button type="button" data-act="extract">Use message as task</button><button type="button" data-act="bulk">Make checklist from lines</button><p class="muted">Keep the original wording. Check names, quantities and dates yourself. Split multiple requests into separate tasks.</p><label for="title">What exactly must I do?</label><input id="title" required placeholder="e.g. Collect prescription" value="${esc(t.title)}"><label for="area">Category (automatic unless changed)</label><select id="area">${['Auto','Home','Work','Personal','FonnLogic'].map(a=>`<option value="${a}" ${a===(t.area||'Auto')?'selected':''}>${a}</option>`).join('')}</select><label for="next">Smallest first step (optional)</label><input id="next" value="${esc(t.next)}" placeholder="e.g. Open the email"><div class="row"><div><label for="date">Due date</label><input id="date" type="date" value="${esc(t.date)}"></div><div><label for="time">Time</label><input id="time" type="time" value="${esc(t.time)}"></div></div><div class="row"><button type="button" data-act="dateToday">Today</button><button type="button" data-act="dateTomorrow">Tomorrow</button></div><label class="check spaced"><input type="checkbox" id="urgent" ${t.urgent?'checked':''}> Important / consequences if missed</label><button class="primary big spaced" type="submit">Save task</button>${editing?`<button type="button" class="danger spaced" data-act="delete" data-id="${t.id}">Delete task</button>`:''}</form></section>`;$('#title').addEventListener('input',()=>{let a=$('#area');a.options[0].textContent='Auto → '+classify($('#title').value+' '+$('#source').value)});$('#capture').onsubmit=e=>{e.preventDefault();let old=find(editing),task={id:old?.id||crypto.randomUUID?.()||String(Date.now())+Math.random(),created:old?.created||Date.now(),done:old?.done||false,completedAt:old?.completedAt||null,title:$('#title').value.trim(),source:$('#source').value.trim(),area:$('#area').value==='Auto'?classify($('#title').value+' '+$('#source').value):$('#area').value,next:$('#next').value.trim(),date:$('#date').value,time:$('#time').value,urgent:$('#urgent').checked};if(!task.title)return;if(old)Object.assign(old,task);else state.tasks.push(task);save();editing=null;page='today';render()}}else if(page==='all'){let list=filter==='done'?state.tasks.filter(t=>t.done):open.filter(t=>filter==='open'||t.area===filter);v.innerHTML=`<section><h2>Everything</h2><label for="filter">Show</label><select id="filter">${[['open','All unfinished'],['Home','Home'],['Work','Work'],['Personal','Personal'],['FonnLogic','FonnLogic'],['done','Completed']].map(([a,b])=>`<option value="${a}" ${filter===a?'selected':''}>${b}</option>`).join('')}</select>${['Work','Home','Personal','FonnLogic'].map(a=>{let group=list.filter(t=>t.area===a);return group.length?`<h3>${a} (${group.length})</h3>${group.map(card).join('')}`:''}).join('')||'<p class="muted">No tasks here.</p>'}</section><details><summary>Backup and privacy</summary><section><p>Data stays in this browser. Export regularly. Clearing browser data can erase it. This app cannot read WhatsApp or notify you when closed; use phone alerts for deadlines.</p><button data-act="export">Export backup</button><label for="restore" style="display:block;margin-top:15px">Restore backup (replaces current data)</label><input id="restore" type="file" accept="application/json,.json"></section></details>`;$('#filter').onchange=e=>{filter=e.target.value;render()};$('#restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.tasks)||!x.tasks.every(t=>typeof t.id==='string'&&/^[\w.-]+$/.test(t.id)&&typeof t.title==='string'&&typeof t.created==='number'))throw Error();if(confirm('Replace current tasks with this backup?')){state={tasks:x.tasks};save();render()}}catch{alert('Invalid backup file.')}}}else if(page==='reports'){v.innerHTML=`<section><h2>Completed work report</h2><p class="muted">Only completed Work tasks. Family and personal tasks never appear here.</p><label>Month</label><input type="month" id="report-month" value="${day().slice(0,7)}"><div id="report-result"></div><div class="row"><button id="report-copy" class="primary">Copy report</button><button id="report-save">Export text</button></div><button id="report-csv" class="big spaced">Export CSV</button></section>`;let rows=[],txt='';function refreshReport(){let month=$('#report-month').value;rows=state.tasks.filter(t=>t.area==='Work'&&t.done&&t.completedAt&&day(new Date(t.completedAt)).startsWith(month)).sort((a,b)=>a.completedAt-b.completedAt);let unknown=state.tasks.filter(t=>t.area==='Work'&&t.done&&!t.completedAt).length;txt='Completed work — '+month+'\n\n'+rows.map(t=>day(new Date(t.completedAt))+' — '+t.title).join('\n');$('#report-result').innerHTML=`<h3>${rows.length} completed tasks</h3>${rows.map(t=>`<div class="task"><small>${esc(day(new Date(t.completedAt)))}</small><strong>${esc(t.title)}</strong></div>`).join('')||'<p>No recorded completions this month.</p>'}${unknown?`<p class="notice">${unknown} older completed tasks have no recorded completion date and are excluded.</p>`:''}`;}$('#report-month').onchange=refreshReport;$('#report-copy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);alert('Report copied.')}catch{prompt('Copy report:',txt)}};$('#report-save').onclick=()=>download('Work-report-'+$('#report-month').value+'.txt',txt,'text/plain');$('#report-csv').onclick=()=>{const q=x=>'"'+String(x).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';download('Work-report-'+$('#report-month').value+'.csv','Completion date,Task\r\n'+rows.map(t=>[day(new Date(t.completedAt)),t.title].map(q).join(',')).join('\r\n'),'text/csv')};refreshReport();}else if(page==='reset'){v.innerHTML=`<section class="focus"><h2>Only the next safe thing.</h2><p>When the house is chaotic, the task list can wait. Make sure the children are safe and deal with any immediate need.</p><button class="primary big" data-act="park">Park a thought for later</button><p>If another adult is available, ask for a handover or help with one specific thing.</p><button data-act="home">Show only home tasks</button></section><section><h2>Work can wait unless urgent</h2><p>Do not reorganise your entire day right now. If something genuinely cannot wait, set a phone alert and return to what is happening in front of you.</p><button data-page="today">Return to one task</button></section>`}else if(page==='focus'){let t=find(focusId);if(!t){page='today';render();return}v.innerHTML=`<section class="focus"><div class="tag">Five-minute start</div><h2>${esc(t.title)}</h2><p>${esc(t.next||'Do the first small physical action. You do not need to finish everything now.')}</p><h1 id="timer" aria-live="off">05:00</h1><p class="muted">You can stop after five minutes. The timer is not a background alarm.</p><button class="primary big" data-act="done" data-id="${t.id}">Finished task</button><div class="row spaced"><button data-act="restart">Another 5 min</button><button data-page="today">Stop for now</button></div></section>`;tick()}}function tick(){let el=$('#timer');if(!el)return;let n=Math.max(0,300-Math.floor((Date.now()-focusStart)/1000));el.textContent=n?`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`:'5 minutes done';}setInterval(tick,500);function download(name,content,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}function ics(t){if(!t.date||!t.time){alert('Choose an exact date and time first, then tap Set phone alert again.');editing=t.id;page='capture';render();return}let d=new Date(t.date+'T'+t.time),stamp=x=>x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');download('OneThing-alert.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//OneThing//EN','BEGIN:VEVENT','UID:'+t.id+'@onething.local','DTSTAMP:'+stamp(new Date()),'DTSTART:'+stamp(d),'DTEND:'+stamp(new Date(+d+15*60000)),'SUMMARY:'+e(t.title),'DESCRIPTION:'+e(t.source),'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:'+e(t.title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),'text/calendar');alert('Open the downloaded calendar event and add it to your calendar. Check that its alert is enabled. For critical tasks, use Apple Reminders directly if import does not work.')}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;editing=null;render();return}let a=b.dataset.act,t=find(b.dataset.id);if(!a)return;if(a==='new'||a==='park'){editing=null;page='capture';render();$('#title').focus();return}if(a==='bulk'){let lines=$('#source').value.split(/\n+/).map(x=>x.replace(/^\s*(?:[-•*]|\d+[.)])\s*/, '').trim()).filter(Boolean);if(!lines.length){alert('Paste one task per line first.');return}if(!confirm('Create '+lines.length+' separate tasks? Check each line contains a complete instruction.'))return;let area=$('#area').value;for(let title of lines)state.tasks.push({id:crypto.randomUUID?.()||String(Date.now())+Math.random(),created:Date.now(),done:false,title,source:$('#source').value,area:area==='Auto'?classify(title):area,next:'',date:$('#date').value,time:$('#time').value,urgent:$('#urgent').checked});save();editing=null;page='today';render();return}if(a==='extract'){$('#title').value=$('#source').value.trim();return}if(a==='dateToday'||a==='dateTomorrow'){$('#date').value=a==='dateToday'?day():tomorrow();return}if(a==='edit'){editing=t.id;page='capture'}if(a==='done'||a==='undo'){t.done=a==='done';t.completedAt=t.done?Date.now():null;if(t.id===focusId)focusId=null;save();if(page==='focus')page='today'}if(a==='tomorrow'){t.date=tomorrow();save()}if(a==='focus'){focusId=t.id;focusStart=Date.now();page='focus'}if(a==='restart'){focusStart=Date.now()}if(a==='delete'){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();page='all';editing=null}else return}if(a==='home'){filter='Home';page='all'}if(a==='calendar'){ics(t);return}if(a==='export'){download('OneThing-backup-'+day()+'.json',JSON.stringify(state,null,2),'application/json');return}render()});render();</script><script>(()=>{
const storage='one-thing-family-v1'; let cfg={}; try{cfg=JSON.parse(localStorage.getItem(storage)||'{}')}catch{};
const fragment=new URLSearchParams(location.hash.slice(1));const sender=fragment.get('mode')==='send';
if(fragment.has('room')){cfg={url:fragment.get('url'),api:fragment.get('api'),room:fragment.get('room')};localStorage.setItem(storage,JSON.stringify(cfg));}
let items=[],status='Not connected',busy=false,connected=false,showDone=false;
const panel=document.createElement('section');panel.id='family-panel';panel.style.cssText='margin:16px 0;background:white;border:1px solid #dce3d9;border-radius:16px;padding:16px';
const main=document.querySelector('main');main.insertBefore(panel,document.querySelector('#view'));
if(sender){document.querySelector('#view').hidden=true;document.querySelector('nav').hidden=true;document.title='One Thing · Send a request';}
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ready=()=>/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cfg.url||'')&&!!cfg.api&&/^[a-f0-9]{64}$/.test(cfg.room||'');
async function rpc(action,payload={}){const r=await fetch(cfg.url+'/rest/v1/rpc/family_inbox',{method:'POST',headers:{apikey:cfg.api,'Content-Type':'application/json'},body:JSON.stringify({p_key:cfg.room,p_action:action,p_payload:payload})});if(!r.ok)throw Error('Connection failed ('+r.status+')');return await r.json()}
function dateText(t){return t.due_date?(t.due_date===day()?'Today':t.due_date<day()?'Overdue · '+t.due_date:t.due_date)+(t.due_time?' · '+t.due_time.slice(0,5):''):'No deadline'}
function list(rows){return rows.map(t=>`<div style="padding:12px 0;border-bottom:1px solid #e6e9e4"><div class="tag">${e(dateText(t))}${t.important?' · Important':''}</div><label style="display:flex;gap:12px;align-items:center;font-size:19px;margin:5px 0"><input style="width:25px;height:25px;flex:none" type="checkbox" data-family-id="${e(t.id)}" ${t.done?'checked':''} ${sender?'disabled':''}><span style="${t.done?'text-decoration:line-through':''}">${e(t.title)}</span></label>${t.details?`<div style="white-space:pre-wrap;margin-left:37px">${e(t.details)}</div>`:''}${sender?`<small>${t.done?'Completed':t.received_at?'Received — not yet completed':'Sent — awaiting acknowledgement'}</small>`:t.done||t.received_at?'<small>Received</small>':`<button class="primary big" data-receive="${e(t.id)}">I’ve received this</button>`}</div>`).join('')||'<p class="muted">Nothing here.</p>'}
function redraw(){const area=panel.querySelector('#family-items');if(!area)return;let open=items.filter(t=>!t.done).sort((a,b)=>Number(b.important)-Number(a.important)||(a.due_date||'9999').localeCompare(b.due_date||'9999'));let tasks=open.filter(t=>t.kind==='task'),shopping=open.filter(t=>t.kind==='shopping');area.innerHTML=`<p id="family-status" class="muted">${e(status)}</p>${!sender&&tasks.length?`<div style="background:#e9f1e7;padding:12px;border-radius:10px"><small>NEXT FAMILY REQUEST</small><h2>${e(tasks[0].title)}</h2><p>${e(tasks[0].details)} · ${e(dateText(tasks[0]))}</p></div>`:''}<h2>Jobs (${tasks.length})</h2>${list(tasks)}<h2>Shopping (${shopping.length})</h2>${list(shopping)}<details ${showDone?'open':''} id="family-done"><summary>Completed (${items.filter(t=>t.done).length})</summary>${list(items.filter(t=>t.done))}</details>`;area.querySelector('#family-done').ontoggle=x=>showDone=x.target.open;}
async function sync(action='list',payload={}){if(!ready()||busy)return false;busy=true;try{items=await rpc(action,payload);if(!sender){let n=items.filter(t=>!t.done&&!t.received_at).length;let a=panel.querySelector('#family-alert');if(a){a.className=n?'notice':'';a.textContent=n?`${n} new or unacknowledged family request${n===1?'':'s'} — tap I’ve received this below.`:'';}document.title=n?`(${n}) One Thing`:'One Thing';}connected=true;status='Synced just now';redraw();return true}catch(err){connected=false;status='Not synced — '+err.message;redraw();return false}finally{busy=false}}
function setup(){panel.innerHTML=`<h2>Connect your family inbox</h2><p>One-time setup: use a free Supabase project and run the supplied database script.</p><form id="family-setup"><label>Project URL</label><input id="family-url" required placeholder="https://your-project.supabase.co" value="${e(cfg.url)}"><label>Publishable or anon key (never service-role)</label><input id="family-api" required value="${e(cfg.api)}"><button class="primary big spaced">Connect</button></form>`;panel.querySelector('form').onsubmit=async ev=>{ev.preventDefault();let bytes=crypto.getRandomValues(new Uint8Array(32));cfg={url:panel.querySelector('#family-url').value.trim().replace(/\/$/,''),api:panel.querySelector('#family-api').value.trim(),room:cfg.room||Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')};if(!ready()){alert('Check the Supabase project URL and key.');return}localStorage.setItem(storage,JSON.stringify(cfg));build();await sync()}}
function build(){if(!ready()){setup();return}panel.innerHTML=`<h2>${sender?'Send a request':'Family inbox'}</h2>${sender?`<form id="send-form"><label>What are you sending?</label><select id="kind"><option value="task">A job / reminder</option><option value="shopping">Shopping list</option></select><label id="title-label">What needs doing?</label><textarea id="family-title" required placeholder="e.g. Collect the girls" maxlength="10000"></textarea><label>Important details (optional)</label><textarea id="family-details" maxlength="2000" placeholder="Exact size, quantity, place…"></textarea><div class="row"><div><label>Due date</label><input id="family-date" type="date"></div><div><label>Time</label><input id="family-time" type="time"></div></div><label class="check"><input type="checkbox" id="family-important"> Important</label><button class="primary big spaced" type="submit">Send to his phone</button><p id="send-status" aria-live="polite"></p></form>`:`<p>Requests sent from the family page appear here. Keep your link private.</p><button id="share-family">Copy wife's private link</button><button id="family-refresh">Refresh</button>`}<div id="family-alert" role="status" aria-live="polite"></div><div id="family-items"></div>`;redraw();if(sender){let form=panel.querySelector('form');panel.querySelector('#kind').onchange=ev=>{let shop=ev.target.value==='shopping';panel.querySelector('#title-label').textContent=shop?'Shopping items — one per line':'What needs doing?';panel.querySelector('#family-title').placeholder=shop?'Milk — 2 litres\nNappies — size 5':'e.g. Collect the girls'};form.onsubmit=async ev=>{ev.preventDefault();if(busy)return;let get=id=>panel.querySelector('#'+id).value.trim(),kind=get('kind'),titles=kind==='shopping'?get('family-title').split(/\n/).map(s=>s.trim()).filter(Boolean):[get('family-title')];if(!titles.length||titles.length>50||titles.some(t=>t.length>500)){alert('Enter 1–50 items, each under 500 characters.');return}let b=form.querySelector('button');b.disabled=true;let ok=await sync('add',{items:titles.map(title=>({title,kind,details:get('family-details'),date:get('family-date'),time:get('family-time'),important:panel.querySelector('#family-important').checked}))});b.disabled=false;panel.querySelector('#send-status').textContent=ok?'Sent successfully.':'Not sent. Please retry.';if(ok)form.reset()}}else{panel.querySelector('#share-family').onclick=async()=>{const u=new URL(location.href);u.hash=new URLSearchParams({mode:'send',url:cfg.url,api:cfg.api,room:cfg.room}).toString();try{await navigator.clipboard.writeText(u.href);alert('Private link copied. Send it only to your wife.')}catch{prompt('Copy this private link:',u.href)}};panel.querySelector('#family-refresh').onclick=()=>sync()}}
panel.addEventListener('click',async ev=>{let b=ev.target.closest('[data-receive]');if(!b||sender)return;b.disabled=true;if(!await sync('receive',{id:b.dataset.receive})){b.disabled=false;alert('Could not acknowledge. Please retry.')}});
panel.addEventListener('change',async ev=>{let box=ev.target;if(!box.dataset.familyId||sender)return;let checked=box.checked;box.disabled=true;if(!await sync('done',{id:box.dataset.familyId,done:checked})){box.checked=!checked;box.disabled=false}});
build();sync();setInterval(()=>{if(!document.hidden)sync()},12000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
})();
</script><script>(()=>{
if(new URLSearchParams(location.hash.slice(1)).get('mode')==='send')return;
const k='one-thing-break-v1';let s={session:null,parked:[]};try{s=JSON.parse(localStorage.getItem(k))||s}catch{};const store=()=>{try{localStorage.setItem(k,JSON.stringify(s))}catch{warn('Break Away could not save on this device.')}};
const p=document.createElement('section');p.id='break-away';document.querySelector('#view').before(p);let expanded=false;let audio;function beep(){try{if(audio?.state==='running'){let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);g.gain.value=.12;o.frequency.value=660;o.start();o.stop(audio.currentTime+.6)}navigator.vibrate?.([300,150,300])}catch{}}
function draw(){let a=s.session;p.innerHTML=`<h2>Break Away</h2>${!a?`<button class="big" id="ba-open">${expanded?'Hide setup':'I’m about to get absorbed'}</button>${expanded?`<form id="ba-form"><label>What am I doing?</label><input id="ba-activity" required placeholder="Music, family research…"><label>What must I switch to afterwards?</label><input id="ba-next" required placeholder="Get the children ready for bed"><label>Time until I need to stop</label><select id="ba-min"><option>5</option><option>10</option><option>15</option><option selected>30</option><option>45</option><option>60</option><option value="120">120 (2 hours)</option></select><button class="primary big">Start with an exit plan</button></form>`:''}`:a.stage==='run'?`<div class="tag">STOP TIME · ${esc(new Date(a.end).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}))}</div><h2 id="ba-clock" aria-live="off"></h2><p>${esc(a.activity)} → ${esc(a.next)}</p><button class="big" id="ba-stop">Break away now</button><p class="muted">Set a matching timer in your iPhone Clock if leaving this app.</p>`:a.stage==='exit'?`<div class="notice">${a.end>Date.now()?'Time to switch.':'Your stop time has arrived.'}</div><h2>Save your place. Then stop.</h2><p>What is the exact next step when you come back?</p><form id="ba-park"><textarea id="ba-note" placeholder="e.g. Check the 1911 census entry next" required></textarea><button class="primary big">Save my place</button></form>${!a.extended?'<button class="big spaced" id="ba-extra">One final 2 minutes to wrap up</button>':''}`:`<h2>Now: ${esc(a.next)}</h2><p>Your place is saved. Close the other app, stand up if safe, and move to the next activity.</p><button class="primary big" id="ba-done">I’ve switched</button>`}${s.parked.length?`<details><summary>Saved places (${s.parked.length})</summary>${s.parked.map(x=>`<div class="task"><strong>${esc(x.activity)}</strong><p>${esc(x.note)}</p><button data-ba-delete="${esc(x.id)}">Remove</button></div>`).join('')}</details>`:''}`;update();}
function update(){let a=s.session;if(a?.stage!=='run')return;let n=Math.max(0,Math.ceil((a.end-Date.now())/1000));if(!n){a.stage='exit';store();beep();draw();return}let el=p.querySelector('#ba-clock');if(el)el.textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0');}
p.addEventListener('click',e=>{let id=e.target.id,a=s.session;if(id==='ba-open'){expanded=!expanded;draw()}if(id==='ba-stop'){a.stage='exit';store();draw()}if(id==='ba-extra'){a.extended=true;a.stage='run';a.end=Date.now()+120000;store();draw()}if(id==='ba-done'){s.session=null;expanded=false;store();draw()}if(e.target.dataset.baDelete){s.parked=s.parked.filter(x=>x.id!==e.target.dataset.baDelete);store();draw()}});
p.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='ba-form'){try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}s.session={activity:p.querySelector('#ba-activity').value.trim(),next:p.querySelector('#ba-next').value.trim(),end:Date.now()+Number(p.querySelector('#ba-min').value)*60000,stage:'run',extended:false};}else if(e.target.id==='ba-park'){s.parked.unshift({id:Date.now().toString(),activity:s.session.activity,note:p.querySelector('#ba-note').value.trim()});s.session.stage='switch'}store();draw()});setInterval(update,500);document.addEventListener('visibilitychange',update);draw();
})();
</script><script>
(()=>{
const b=document.createElement('button');b.id='reset-now';b.className='big';b.textContent='Reset now — I’m getting snappy';b.style.cssText='background:#f2dfc5;color:#553c23;font-weight:650;margin-bottom:12px';document.querySelector('header').after(b);
const panel=document.createElement('div');panel.hidden=true;panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label','Reset now');panel.style.cssText='position:fixed;inset:0;z-index:10000;background:#f5f3ed;overflow:auto;padding: max(24px,env(safe-area-inset-top)) 18px 32px';document.body.append(panel);let timer,stage=0,end=0,prior=[];
const screens=[['Stop talking for a moment.','Put down what you are doing. Lower your voice. You do not need to settle the argument right now.','Next'],['Reduce the noise and demands.','Turn off unnecessary sound. If another adult can safely take over, ask for two minutes. Otherwise stay with the children and reduce demands. Never leave young children unsupervised.','Give myself 60 seconds'],['Only the next necessary thing.','Check what the children actually need right now. Everything non-urgent can wait.','Ready to reconnect'],['Repair if needed.','Say: “Sorry I snapped. That wasn’t fair. I’m going to try again.” You don’t need to explain or defend yourself.','Return to my day']];
function close(){clearInterval(timer);panel.hidden=true;prior.forEach(([el,was])=>el.inert=was);document.body.style.overflow='';b.focus()}
function draw(){clearInterval(timer);let x=screens[stage];panel.innerHTML=`<div style="max-width:480px;margin:auto"><p class="tag">RESET NOW · ${stage+1} OF 4</p><h1 style="font-size:32px">${x[0]}</h1><p style="font-size:21px">${x[1]}</p>${stage===0?'<section><strong>Say this if you need words:</strong><p>“I’m getting overwhelmed. I need a minute. I’ll come back to this.”</p></section>':''}${stage===2?'<section><h2 id="reset-count">60 seconds</h2><p>Let your shoulders drop and breathe normally. No need to do anything perfectly.</p></section>':''}<button id="reset-next" class="primary big">${x[2]}</button><button id="reset-close" class="big spaced">Close reset</button><details><summary>If I feel close to losing control</summary><p>Stop the interaction, put any objects down, and ask another adult to take over safely. If you fear you may hurt someone, get immediate help; call 112 or 999 if there is immediate danger.</p></details></div>`;panel.querySelector('#reset-next').onclick=()=>{if(stage===3){close();return}stage++;if(stage===2)end=Date.now()+60000;draw()};panel.querySelector('#reset-close').onclick=close;if(stage===2){const tick=()=>{let n=Math.max(0,Math.ceil((end-Date.now())/1000));panel.querySelector('#reset-count').textContent=n?n+' seconds':'Take more time if you need it';if(!n)clearInterval(timer)};tick();timer=setInterval(tick,250)}panel.querySelector('#reset-next').focus()}
b.onclick=()=>{stage=0;prior=[...document.body.children].filter(el=>el!==panel).map(el=>[el,el.inert]);prior.forEach(([el])=>el.inert=true);panel.hidden=false;document.body.style.overflow='hidden';draw()};
})();
</script>
